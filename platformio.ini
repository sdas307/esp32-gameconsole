; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wokwi

[env:device]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -DDEVICE_BUILD
build_src_filter =
	+<*> ; include everything
	-<input_emulator.cpp> ; exclude emulator-only file
lib_deps = 
	adafruit/Adafruit GFX Library @ ^1.11.5
	adafruit/Adafruit SH110X@^2.1.12

[env:wokwi]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -DEMULATOR_BUILD
build_src_filter =
	+<*> ; include everything
	-<input_device.cpp> ; exclude device-only file
lib_deps = 
	adafruit/Adafruit GFX Library @ ^1.11.5
	adafruit/Adafruit SSD1306 @ ^2.5.7
	adafruit/Adafruit SH110X@^2.1.12

; monitor_port = COM1      ; or /dev/ttyUSB0
; monitor_speed = 115200